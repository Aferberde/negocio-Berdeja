<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeAPI Explorer - Práctica Web III</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>PokeAPI Explorer</h1>
        <p>Buscador e interacción con Pokémon mediante Fetch API</p>
    </header>

    <main class="container">
        <section class="search-box">
            <input type="text" id="pokemon-input" placeholder="Ingresa nombre o número de Pokémon...">
            <button id="search-btn">Buscar Pokémon</button>
        </section>

        <section id="pokemon-card" class="card">
            <!-- Los datos del Pokémon se cargarán dinámicamente -->
            <p>Escribe el nombre de un Pokémon y presiona Buscar.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
